[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "slinky-lab"
version = "0.1.0"
description = "Three-dimensional Slinky dynamics research workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco==3.15.0",
  "numpy==2.2.5",
  "scipy==1.15.2",
  "fastapi==0.115.12",
  "pydantic==2.11.4",
  "uvicorn[standard]==0.34.2",
  "h5py==3.13.0",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]

[project.scripts]
slinky-lab = "slinky_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/slinky_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
